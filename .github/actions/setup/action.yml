name: Setup project
description: Sets up the repo code, Node.js, and npm dependencies

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '26.x'
        cache: npm
        registry-url: https://registry.npmjs.org
    - name: Install npm dependencies
      run: npm ci
      shell: bash
